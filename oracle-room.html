<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="依可追溯文獻、出版社與館藏紀錄整理神諭卡知識。探索24張原創神諭卡與留在瀏覽器的月光手札。"><meta name="theme-color" content="#21192c"><link rel="alternate" type="application/json" title="神諭卡公開知識資料" href="/oracle-data-manifest.json"><title>神諭之間｜神諭卡知識與月光手札</title><style>html,body{margin:0}.host{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr);height:100dvh;min-height:0;overflow:hidden;background:#21192c;color:#d9ceba}.frame{display:block;width:100%;height:100%;min-width:0;min-height:0;border:0;background:#21192c}.status{align-self:center;justify-self:center;margin:24px;font:14px/1.8 system-ui,sans-serif;color:#c9ae79}</style></head><body><main id="oracle-room-host" class="host"><p id="oracle-room-status" class="status" role="status">正在翻開神諭之間……</p></main><script>(async function oracleStaticRoomHost(config){
