<title>晴光花園｜神諭之間</title>
<style>
:root{color-scheme:dark;--bg:#130f1d;--panel:#211a2e;--gold:#d9bf87;--text:#f0e6d3;--muted:#b9abc7;--line:rgba(217,191,135,.26);font-family:Georgia,"Noto Serif TC","Microsoft JhengHei",serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 70% 0,rgba(107,72,127,.22),transparent 54%),linear-gradient(135deg,#181120,#100d19);color:var(--text)}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.38;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid #f2d99d;outline-offset:4px}
a{color:inherit;text-decoration:none}
.shell{height:100dvh;width:min(1440px,100%);margin:0 auto;padding:22px 30px 16px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px}
.header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.eyebrow{margin:0 0 6px;color:var(--gold);font:10px/1.3 Georgia,serif;letter-spacing:.25em}
h1{margin:0;font-size:28px;line-height:1.3;font-weight:500;letter-spacing:.14em}
.subtitle{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.5;letter-spacing:.035em}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.nav a,.page-button,.dialog-button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 15px;border:1px solid var(--line);border-radius:8px;background:rgba(217,191,135,.04);color:var(--gold);font-size:13px;line-height:1.3}
.nav a:hover,.page-button:not(:disabled):hover,.dialog-button:not(:disabled):hover{background:rgba(217,191,135,.12);border-color:rgba(217,191,135,.65)}
.gallery{min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:14px}
.card-tile{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:7px;padding:13px 13px 10px;color:var(--text);border:1px solid var(--line);border-radius:15px;background:radial-gradient(ellipse at center 38%,rgba(145,104,168,.13),transparent 66%),linear-gradient(150deg,rgba(65,48,79,.43),rgba(27,21,39,.82));overflow:hidden;transition:border-color .2s,background .2s,transform .2s}
.card-tile:before{content:"";position:absolute;left:13px;top:11px;color:var(--gold);font-size:10px;letter-spacing:.15em}
.card-tile:hover{border-color:rgba(217,191,135,.74);background:radial-gradient(ellipse at center 38%,rgba(145,104,168,.23),transparent 66%),linear-gradient(150deg,rgba(65,48,79,.59),rgba(27,21,39,.82))}
.art-frame{min-width:0;min-height:0;display:grid;place-items:center;padding:0 2px;filter:drop-shadow(0 8px 15px rgba(0,0,0,.34))}
.art-frame svg{display:block;width:auto;height:100%;max-width:100%;max-height:100%;aspect-ratio:3/5}
.card-meta{min-width:0;text-align:center}
.card-name{margin:0;font-size:17px;line-height:1.3;letter-spacing:.16em}
.card-keywords{margin:3px 0 0;color:var(--muted);font-family:"Microsoft JhengHei",sans-serif;font-size:11px;line-height:1.5;letter-spacing:.02em}
.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;padding-top:12px;border-top:1px solid var(--line)}
.footer-note{margin:0;color:var(--muted);font-family:"Microsoft JhengHei",sans-serif;font-size:11px;line-height:1.5}
.page-controls{display:flex;align-items:center;gap:14px}
.page-label{min-width:70px;text-align:center;color:var(--gold);font-size:12px;white-space:nowrap}
.page-button{min-width:74px;min-height:40px}
dialog{padding:0;border:1px solid rgba(217,191,135,.4);border-radius:18px;color:var(--text);background:radial-gradient(ellipse at center top,#392843,#191222 65%);width:min(780px,calc(100vw - 32px));height:min(820px,calc(100dvh - 32px));max-width:none;max-height:none;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.66)}
dialog::backdrop{background:rgba(7,5,13,.84);backdrop-filter:blur(7px)}
.dialog-shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:20px 24px;gap:16px}
.dialog-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dialog-heading{margin:0;color:var(--gold);font-size:12px;line-height:1.5;letter-spacing:.1em}
.dialog-main{min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,.8fr);align-items:center;gap:30px}
.dialog-art{height:100%;min-height:0;min-width:0;display:grid;place-items:center;filter:drop-shadow(0 16px 22px rgba(0,0,0,.4))}
.dialog-art svg{display:block;max-height:100%;max-width:100%;width:auto;height:100%;aspect-ratio:3/5}
.dialog-copy{min-width:0}
.dialog-type{margin:0 0 11px;color:var(--muted);font-size:12px;line-height:1.5;letter-spacing:.08em}
.dialog-name{margin:0;font-size:31px;font-weight:500;line-height:1.3;letter-spacing:.17em}
.dialog-keywords{margin:11px 0 0;color:var(--gold);font-family:"Microsoft JhengHei",sans-serif;font-size:13px;line-height:1.6}
.dialog-message{margin:19px 0 0;color:var(--text);font-size:16px;line-height:1.8}
.dialog-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.dialog-hint{margin:0;color:var(--muted);font-family:"Microsoft JhengHei",sans-serif;font-size:11px;line-height:1.5}
.dialog-move{display:flex;gap:10px}
.dialog-button{min-height:42px}
@media(max-width:700px){
.shell{padding:14px 14px 12px;gap:12px}
.header{display:grid;grid-template-columns:1fr auto;gap:7px 10px;align-items:end;padding-bottom:11px}
.eyebrow{font-size:8px;letter-spacing:.18em;margin-bottom:4px}
h1{font-size:22px;letter-spacing:.1em}
.subtitle{font-size:11px;line-height:1.5;margin-top:6px}
.nav{gap:6px;align-self:start}
.nav a{min-height:38px;padding:8px 10px;font-size:11px;max-width:78px;text-align:center}
.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card-tile{padding:10px 7px 8px;gap:6px;border-radius:12px}
.card-name{font-size:15px}
.card-keywords{font-size:10px;line-height:1.5;margin-top:3px}
.footer{padding-top:10px;gap:8px}
.footer-note{display:none}
.page-controls{width:100%;justify-content:space-between;gap:8px}
.page-button{min-height:40px;min-width:78px;padding:9px 12px}
.page-label{font-size:12px}
dialog{width:calc(100vw - 24px);height:calc(100dvh - 24px);border-radius:14px}
.dialog-shell{padding:13px 15px;gap:10px}
.dialog-header{padding-bottom:9px}
.dialog-heading{font-size:10px;letter-spacing:.06em}
.dialog-main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:12px}
.dialog-art{height:100%}
.dialog-copy{text-align:center}
.dialog-type{font-size:10px;margin:0 0 3px;line-height:1.4}
.dialog-name{font-size:22px;line-height:1.3}
.dialog-keywords{font-size:11px;line-height:1.5;margin-top:6px}
.dialog-message{font-size:13px;line-height:1.6;margin-top:8px}
.dialog-footer{padding-top:9px}
.dialog-hint{display:none}
.dialog-move{width:100%;justify-content:space-between}
.dialog-button{min-height:40px;font-size:11px;padding:9px 11px}
}
@media(max-height:600px) and (min-width:701px){
.shell{padding-top:12px;gap:10px}.header{padding-bottom:10px}.subtitle{margin-top:3px}.card-tile{padding:7px;gap:4px}.card-name{font-size:14px}.card-keywords{font-size:10px}.footer{padding-top:8px}.dialog-shell{padding:12px 18px;gap:10px}.dialog-main{gap:20px}.dialog-name{font-size:25px}.dialog-message{font-size:14px}
}
@media(max-height:560px) and (max-width:700px){
.shell{padding-top:9px;gap:8px}.header{padding-bottom:8px}.eyebrow{display:none}.subtitle{font-size:10px;margin-top:4px}.card-tile{padding:6px;gap:3px}.card-name{font-size:13px}.card-keywords{font-size:9px;margin-top:1px}.footer{padding-top:7px}.page-button{min-height:38px}.dialog-shell{padding:10px 12px;gap:7px}.dialog-main{gap:8px}.dialog-type{display:none}.dialog-name{font-size:19px}.dialog-keywords{margin-top:3px}.dialog-message{font-size:12px;margin-top:5px}.dialog-header{padding-bottom:7px}.dialog-footer{padding-top:7px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
:root{color-scheme:light;--bg:#fbf7f1;--panel:#fffdf9;--gold:#765529;--text:#392d48;--muted:#695a73;--line:#ded0bd}

</style>

<script>
"use strict";
const cards=[{"name":"留白","en":"STILLNESS","type":"月亮與元素","keywords":"停頓 · 空間 · 傾聽","message":"空出一點時間，聽見自己正在想什麼。","action":"關掉通知五分鐘，寫下此刻最明顯的一個感受。","prompt":"當我暫時放下忙碌，有什麼聲音浮現？","color":"#554268","art":"moon","id":"moonlit-01","number":1},{"name":"潮汐","en":"THE TIDES","type":"月亮與元素","keywords":"情緒 · 流動 · 允許","message":"感受會流動，你可以先陪它待一會兒。","action":"為今天的情緒取一個名字，再寫下它可能需要什麼。","prompt":"我正在感受什麼？哪些事情是我今天能影響的？","color":"#284354","art":"waves","id":"moonlit-02","number":2},{"name":"根系","en":"ROOTED","type":"植物與夢境","keywords":"安住 · 日常 · 支持","message":"回到那些能支持你的日常。","action":"整理桌面上一個小角落，讓接下來的一件事容易開始。","prompt":"哪個簡單的習慣，曾讓我覺得比較安定？","color":"#374d45","art":"roots","id":"moonlit-03","number":3},{"name":"門扉","en":"THE THRESHOLD","type":"植物與夢境","keywords":"開始 · 好奇 · 嘗試","message":"把第一步縮小，讓自己有機會出發。","action":"選一件拖延的小事，只花十分鐘開始。","prompt":"如果第一步不用完美，我願意先做什麼？","color":"#554157","art":"door","id":"moonlit-04","number":4},{"name":"界線","en":"BOUNDARIES","type":"自我關懷","keywords":"選擇 · 尊重 · 清楚","message":"溫柔，也可以有清楚的邊界。","action":"練習說出一句：「我需要想一下，晚一點回覆你。」","prompt":"我在哪裡答應得太快？我真正願意付出多少？","color":"#59414c","art":"mountains","id":"moonlit-05","number":5},{"name":"微光","en":"INNER LIGHT","type":"自我關懷","keywords":"留意 · 資源 · 希望","message":"留意那些尚未被你看見的支持。","action":"寫下三個實際支持過你的人、習慣或事物，今天靠近其中一個。","prompt":"最近有哪些微小的支持，被我忽略了？","color":"#49385e","art":"light","id":"moonlit-06","number":6},{"name":"回聲","en":"THE ECHO","type":"月亮與元素","keywords":"覺察 · 模式 · 需要","message":"反覆出現的感受，值得被慢慢聽見。","action":"記下一件最近重複發生的事，分別列出「發生的事」與「我的解讀」。","prompt":"在這些反覆的經驗裡，哪個需要一直沒有被說出來？","color":"#354653","art":"echo","id":"moonlit-07","number":7},{"name":"同行","en":"TOGETHER","type":"自我關懷","keywords":"連結 · 信任 · 求助","message":"讓值得信任的人，知道你需要怎樣的陪伴。","action":"選一位信任的人，具體提出一個小請求，例如陪你聊十分鐘。","prompt":"我希望別人怎麼陪我？我能如何把這個需要說清楚？","color":"#49434e","art":"together","id":"moonlit-08","number":8},{"name":"新月","en":"NEW MOON","type":"月亮與元素","keywords":"意圖 · 起點 · 可能","message":"為還沒有形狀的願望，留一個開始的位置。","action":"寫下一個這週想實踐的意圖，放在每天看得到的地方。","prompt":"此刻，我想為生活邀請什麼新的可能？","color":"#392b4f","art":"moon","id":"moonlit-09","number":9},{"name":"星河","en":"STARLIT RIVER","type":"月亮與元素","keywords":"視野 · 連結 · 方向","message":"把目光放遠一點，重新看見事情之間的連結。","action":"畫出目前在意的三件事，用線標出它們彼此的關係。","prompt":"當我放大視野，眼前這件事在生活中佔著什麼位置？","color":"#45365b","art":"light","id":"moonlit-10","number":10},{"name":"晨露","en":"MORNING DEW","type":"植物與夢境","keywords":"感官 · 細節 · 當下","message":"一個細小的發現，也值得你停下來。","action":"觀察身邊一株植物一分鐘，記下三個先前沒有留意的細節。","prompt":"今天有哪些細節，讓我感覺自己正在好好生活？","color":"#335a59","art":"roots","id":"moonlit-11","number":11},{"name":"霧林","en":"MISTWOOD","type":"植物與夢境","keywords":"未知 · 線索 · 耐心","message":"看不清全貌時，先辨認手邊的線索。","action":"為正在猶豫的選擇，列出一項已知事實與一項待確認的資訊。","prompt":"關於這件事，我已經知道什麼，又需要了解什麼？","color":"#3b6060","art":"roots","id":"moonlit-12","number":12},{"name":"落葉","en":"FALLING LEAVES","type":"植物與夢境","keywords":"整理 · 減量 · 告別","message":"有些曾經需要的東西，可以在此刻放下。","action":"從今天的待辦清單中，移除一件已經失去目的的小事。","prompt":"什麼曾經幫助過我，現在卻需要重新衡量？","color":"#66524d","art":"roots","id":"moonlit-13","number":13},{"name":"萌芽","en":"FIRST SPROUT","type":"植物與夢境","keywords":"培養 · 照料 · 成長","message":"替你在意的事，提供一點持續的照料。","action":"為一個正在培養的興趣，安排本週十分鐘的練習時間。","prompt":"哪件事正在慢慢生長，而我能給它什麼支持？","color":"#2d5154","art":"roots","id":"moonlit-14","number":14},{"name":"山徑","en":"MOUNTAIN PATH","type":"月亮與元素","keywords":"步伐 · 調整 · 耐力","message":"讓前進的步伐，配合你今天的力氣。","action":"把一件過大的任務拆成三段，圈出今天能完成的一段。","prompt":"我可以怎麼調整步伐，讓這件事持續做得下去？","color":"#554e5b","art":"mountains","id":"moonlit-15","number":15},{"name":"靜湖","en":"STILL LAKE","type":"月亮與元素","keywords":"觀察 · 沉澱 · 清晰","message":"讓念頭沉一沉，再選擇如何回應。","action":"把一則讓你在意的訊息的回覆先存成草稿，十分鐘後再讀一次。","prompt":"留一點時間之後，我會如何理解自己的反應？","color":"#294b4d","art":"waves","id":"moonlit-16","number":16},{"name":"晚風","en":"EVENING BREEZE","type":"月亮與元素","keywords":"鬆動 · 轉換 · 呼吸","message":"換一個位置，給緊繃的思緒一點流動。","action":"走到窗邊或戶外，花三分鐘感受空氣與周圍的聲音。","prompt":"今天哪一處緊繃，需要我換個方式對待？","color":"#4d3b60","art":"echo","id":"moonlit-17","number":17},{"name":"歸巢","en":"HOMECOMING (function installOracleArtwork(){
 "use strict";
 let queued=false;
 const setState=(image,state)=>{
  const card=image.closest("svg[data-art-card]");if(!card)return;
  card.dataset.artReady=state;
  const fallback=card.querySelector("[data-art-fallback]"),overlay=card.querySelector("[data-art-overlay]");
  if(fallback)fallback.style.visibility=state==="loaded"?"hidden":"visible";
  if(overlay)overlay.style.visibility=state==="loaded"?"visible":"hidden";
 };
 const request=card=>{
  const image=card.querySelector("image[data-art-source]");
  if(!image||image.dataset.artRequested)return;
  image.dataset.artRequested="true";
  image.setAttribute("href",image.dataset.artSource);
 };
 const observer=typeof IntersectionObserver==="function"?new IntersectionObserver(entries=>{
  for(const entry of entries)if(entry.isIntersecting){request(entry.target);observer.unobserve(entry.target);}
 },{rootMargin:"80px",threshold:0.001}):null;
 const refresh=()=>{
  queued=false;
  for(const card of document.querySelectorAll("svg[data-art-card]")){
   if(card.dataset.artObserved)continue;card.dataset.artObserved="true";
   if(observer)observer.observe(card);else request(card);
  }
 };
 const schedule=()=>{if(!queued){queued=true;requestAnimationFrame(refresh);}};
 document.addEventListener("load",event=>{const image=event.target;if(image?.localName==="image"&&image.hasAttribute("data-art-source"))setState(image,"loaded");},true);
 document.addEventListener("error",event=>{const image=event.target;if(image?.localName==="image"&&image.hasAttribute("data-art-source"))setState(image,"fallback");},true);
 new MutationObserver(records=>{if(records.some(r=>r.addedNodes.length))schedule();}).observe(document.body,{childList:true,subtree:true});
 const frozenCards=Object.freeze(oracleArtCards.map(c=>Object.freeze({...c,viewBox:Object.freeze(c.viewBox.slice())})));
 const frozenAssets=Object.freeze(oracleArtAssets.map(a=>Object.freeze({...a})));
 Object.defineProperty(window,"oracleArtwork",{value:Object.freeze({
  version:"hopeful-painted-v3",cards:frozenCards,assets:frozenAssets,
  snapshot:()=>Object.freeze({version:"hopeful-painted-v3",rendered:document.querySelectorAll("svg[data-art-card]").length,loaded:document.querySelectorAll('svg[data-art-ready="loaded"]').length,fallback:document.querySelectorAll('svg[data-art-ready="fallback"]').length})
 }),writable:false,configurable:false});
 schedule();
})();

const gallery=document.getElementById("gallery");

const narrow=window.matchMedia("(max-width:700px)");
let perPage=narrow.matches?4:6,page=0,uidCount=0,currentCard=0,returnId=null;
function putText(id,value){document.getElementById(id).textContent=value;}

function render(focusId){
 const start=page*perPage,end=Math.min(start+perPage,cards.length);
 gallery.replaceChildren();
 gallery.setAttribute("aria-label","新版牌面，第 "+(start+1)+" 至 "+end+" 張，共 "+cards.length+" 張");
 for(let i=start;i<end;i++){
  const c=cards[i],button=document.createElement("button");

  button.setAttribute("aria-label","欣賞第 "+c.number+" 張牌面："+c.name+"，"+c.keywords);
  const frame=document.createElement("div");frame.className="art-frame";frame.innerHTML=uniqueArt(c);

  const meta=document.createElement("div");meta.className="card-meta";
  const name=document.createElement("p");name.className="card-name";name.textContent=c.name;

 previous.disabled=page===0;next.disabled=page>=Math.ceil(cards.length/perPage)-1;
 label.textContent="第 "+(page+1)+" / "+Math.ceil(cards.length/perPage)+" 頁";
 if(focusId){const target=gallery.querySelector('[data-card-id="'+focusId+'"]');if(target)target.focus({preventScroll:true});}

function goPage(delta){

 if(proposed===page)return;

function fillDialog(index){

 const proposed=currentCard+delta;if(proposed<0||proposed>=cards.length)return;
 const active=document.activeElement;fillDialog(proposed);
 if((active===cardPrevious&&cardPrevious.disabled)||(active===cardNext&&cardNext.disabled))closeButton.focus({preventScroll:true});
}
previous.addEventListener("click",()=>goPage(-1));next.addEventListener("click",()=>goPage(1));
closeButton.addEventListener("click",()=>dialog.close());
cardPrevious.addEventListener("click",()=>moveCard(-1));cardNext.addEventListener("click",()=>moveCard(1));
dialog.addEventListener("close",()=>{
 const index=cards.findIndex(c=>c.id===returnId);
 if(index>=0){page=Math.floor(index/perPage);render(returnId);}returnId=null;
});
dialog.addEventListener("click",event=>{
 if(event.target!==dialog)return;
 const rect=dialog.getBoundingClientRect();
 if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();
});
document.addEventListener("keydown",event=>{
 if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
 if(event.key!=="ArrowLeft"&&event.key!=="ArrowRight")return;
 event.preventDefault();const delta=event.key==="ArrowLeft"?-1:1;
 if(dialog.open)moveCard(delta);else goPage(delta);
});
function onResize(){
 const newCount=narrow.matches?4:6;if(newCount===perPage)return;
 const active=document.activeElement,focusId=active&&active.classList.contains("card-tile")?active.dataset.cardId:null;
 const firstIndex=page*perPage,index=focusId?cards.findIndex(c=>c.id===focusId):firstIndex;
 perPage=newCount;page=Math.floor(Math.max(0,index)/perPage);render(focusId);
}
if(narrow.addEventListener)narrow.addEventListener("change",onResize);else narrow.addListener(onResize);
Object.defineProperty(window,"oracleArtArchive",{value:Object.freeze({
 deckIds:Object.freeze(cards.map(c=>c.id)),
 cards:Object.freeze(cards.map(c=>Object.freeze({...c}))),
 snapshot:()=>Object.freeze({page:page+1,perPage,firstId:cards[page*perPage].id,count:cards.length,dialogId:dialog.open?cards[currentCard].id:null})
}),writable:false,configurable:false,enumerable:true});
render();

</script>
</body>
